services:
  denova:
    build: .
    # Passes every .env variable into the container (model keys etc.); absent
    # on Coolify, where variables come from the platform UI via interpolation.
    env_file:
      - path: .env
        required: false
    ports:
      - "${DENOVA_PORT:-8080}:8080"
    environment:
      # Published ports reach the container from the Docker bridge, which the
      # access gate treats as remote: LAN access is structural, do not remove.
      DENOVA_ALLOW_LAN_ACCESS: "true"
      DENOVA_WORKSPACE: /workspace
      # Login credentials: override in .env or the platform's environment
      # settings (Coolify). The interpolation also lets Coolify reach them.
      DENOVA_REMOTE_ACCESS_USERNAME: ${DENOVA_REMOTE_ACCESS_USERNAME:-admin}
      DENOVA_REMOTE_ACCESS_PASSWORD: ${DENOVA_REMOTE_ACCESS_PASSWORD:-change-me}
      # Required behind a reverse proxy (Coolify/Traefik/Nginx): honor
      # X-Forwarded-Host/Proto so the origin check accepts the public URL.
      DENOVA_TRUST_PROXY_HEADERS: ${DENOVA_TRUST_PROXY_HEADERS:-true}
    volumes:
      - denova-data:/data
      - ./workspace:/workspace
    restart: unless-stopped

volumes:
  denova-data:
