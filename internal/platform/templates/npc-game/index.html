<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonlit Messages</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <section class="investigation">
    <header class="masthead"><small id="eyebrow"></small><h1 id="title"></h1><p id="intro"></p></header>
    <section class="scene-panel" aria-labelledby="sceneTitle"><h2 id="sceneTitle"></h2>
      <div id="scene" class="scene">
        <div class="moon" aria-hidden="true"></div><div class="mountains" aria-hidden="true"></div>
        <div class="station" aria-hidden="true"><div class="roof"></div><div class="windows"></div><div class="door"></div></div>
        <div class="rails" aria-hidden="true"></div><div class="lamp" aria-hidden="true"></div>
        <button class="hotspot clock" id="clock"></button><button class="hotspot notice" id="notice"></button><button class="hotspot letter" id="letter"></button>
      </div>
    </section>
    <section class="notebook" aria-labelledby="evidenceTitle"><h2 id="evidenceTitle"></h2><ul id="evidence"></ul></section>
    <section class="case" aria-labelledby="caseTitle"><div><h2 id="caseTitle"></h2><p id="objective"></p></div><button id="resolve" disabled></button></section>
  </section>
  <section class="conversation">
    <nav id="contacts"></nav>
    <header class="chat-header"><span class="avatar" id="avatar" aria-hidden="true"></span><div><h2 id="name"></h2><p id="bio"></p></div></header>
    <div class="timeline"><button id="older" hidden></button><div id="messages" role="log"></div></div>
    <footer><p id="status" role="status"></p><button id="retry" hidden></button>
      <div id="composer"><label class="sr-only" id="label" for="prompt"></label><textarea id="prompt" rows="2" maxlength="8000" disabled></textarea><div class="actions"><small id="hint"></small><button type="button" id="cancel" hidden></button><button type="button" id="send" disabled></button></div></div>
    </footer>
  </section>
</main><script type="module" src="game.mjs"></script></body></html>
