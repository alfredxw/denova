name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      GO_MODULES: ". agent"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            agent/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check

      - name: Check Go module manifests
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            echo "==> go mod tidy -diff (${module})"
            (cd "${module}" && go mod tidy -diff)
          done

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            echo "==> go test (${module})"
            (cd "${module}" && go test ./...)
          done

      - name: Run Go vet
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            echo "==> go vet (${module})"
            (cd "${module}" && go vet ./...)
          done

      - name: Check reachable Go vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck="$(go env GOPATH)/bin/govulncheck"
          for module in ${GO_MODULES}; do
            echo "==> govulncheck (${module})"
            (cd "${module}" && "${govulncheck}" ./...)
          done

      - name: Run frontend tests
        run: pnpm --dir web test

      - name: Build frontend
        run: pnpm --dir web build

      - name: Build distribution
        run: ./scripts/build.sh

  windows-filesystem-durability:
    name: Windows filesystem durability regressions
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify shared directory durability consumers
        run: go test ./internal/localfs ./internal/workspace/documentreview ./internal/workspace/change -count=1
