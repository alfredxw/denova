name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GO_MODULES: ". agent"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            agent/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

      - name: Test installer
        run: scripts/install_test.sh

      - name: Check Go module manifests
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            echo "==> go mod tidy -diff (${module})"
            (cd "${module}" && go mod tidy -diff)
          done

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            echo "==> go test (${module})"
            (cd "${module}" && go test ./...)
          done

      - name: Run Go vet
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            echo "==> go vet (${module})"
            (cd "${module}" && go vet ./...)
          done

      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Check frontend translations
        id: translations
        run: pnpm --dir web check:i18n

      - name: Run frontend unit tests
        run: pnpm --dir web test:unit --reporter=default --reporter=junit --outputFile=test-results/unit.xml

      - name: Build distribution
        id: build
        if: ${{ !cancelled() && steps.translations.outcome == 'success' }}
        run: ./scripts/build.sh

      - name: Smoke-test production frontend
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --dir web smoke:production

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-checks
          path: |
            web/playwright-report
            web/test-results/unit.xml
            web/test-results/playwright.json
            web/test-results/artifacts
            web/test-results/production-artifacts
          if-no-files-found: ignore
          retention-days: 7

  browser-tests:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Independent backends and data roots prevent suite state from leaking.
      # Report both suites even when one fails; do not hide flakes with retries.
      fail-fast: false
      matrix:
        project: [browser, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agent/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run Playwright suite
        run: pnpm --dir web exec playwright test --project=${{ matrix.project }}

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.project }}
          path: |
            web/playwright-report
            web/test-results/playwright.json
            web/test-results/artifacts
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required-check name, covering every isolated suite.
  test-build:
    name: Test and build
    if: ${{ always() }}
    needs: [checks, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all suites to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
