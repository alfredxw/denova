name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
      manifests: ${{ steps.paths.outputs.manifests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            git show --format= --check HEAD
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'manifests=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$BASE" 2>/dev/null || git fetch --depth=1 origin "$BASE"
          git diff --check "$BASE" HEAD
          files=$(git diff --name-only "$BASE" HEAD)
          # Skill Markdown is executable product context and is not excluded.
          if printf '%s\n' "$files" | grep -qvE '^(docs/|README(\.en)?\.md$|AGENTS\.md$|CHANGELOG\.md$|LICENSE$)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -qE '^(agent/)?go\.(mod|sum)$'; then
            echo 'manifests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'manifests=false' >> "$GITHUB_OUTPUT"
          fi

  go:
    name: Go (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', agent]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - name: Install ripgrep if needed
        run: command -v rg || (sudo apt-get update && sudo apt-get install --yes ripgrep)
      - name: Check changed module manifests
        if: needs.changes.outputs.manifests == 'true'
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff
      - name: Test and vet
        working-directory: ${{ matrix.module }}
        run: |
          go test ./...
          go vet ./...
      - name: Test installer and packaging
        if: matrix.module == '.'
        run: |
          scripts/install_test.sh
          bash scripts/build-github-release_test.sh

  unit:
    name: Frontend unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Apply the same cap to both Vitest projects on hosted runners.
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm --dir web check:i18n
      - run: pnpm --dir web test:unit --reporter=default --reporter=junit --outputFile=test-results/unit.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports-unit
          path: web/test-results/unit.xml
          retention-days: 7

  build:
    name: Build tested distribution
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - uses: ./.github/actions/setup-web
      - run: ./scripts/build.sh
      # Tar preserves executable permissions, including bundled ripgrep.
      - run: tar -cf ci-distribution.tar -C output .
      - uses: actions/upload-artifact@v7
        with:
          name: ci-distribution
          path: ci-distribution.tar
          compression-level: 0
          retention-days: 14

  browser-tests:
    name: Playwright (${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      DENOVA_E2E_PACKAGE_DIR: ${{ github.workspace }}/output
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@v8
        with:
          name: ci-distribution
      - run: mkdir -p output && tar -xf ci-distribution.tar -C output
      - run: pnpm --dir web exec playwright install --with-deps chromium
      # All journeys, including production-only worker/chunk checks, run once
      # against the same distribution. No Vite dev server or per-shard Go build.
      - run: pnpm --dir web exec playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports-browser-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results/playwright.json
            web/test-results/artifacts
          if-no-files-found: ignore
          retention-days: 7

  test-build:
    name: Test and build
    if: ${{ always() }}
    needs: [changes, go, unit, build, browser-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable suites to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GO: ${{ needs.go.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          BROWSER: ${{ needs.browser-tests.result }}
        run: |
          test "$CHANGES" = success
          if [[ "$CODE" == true ]]; then
            for result in "$GO" "$UNIT" "$BUILD" "$BROWSER"; do
              test "$result" = success
            done
          fi
