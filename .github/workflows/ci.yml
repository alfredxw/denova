name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      GO_MODULES: ". agent"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            agent/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check

      - name: Test installer
        run: scripts/install_test.sh

      - name: Check Go module manifests
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            echo "==> go mod tidy -diff (${module})"
            (cd "${module}" && go mod tidy -diff)
          done

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            echo "==> go test (${module})"
            (cd "${module}" && go test ./...)
          done

      - name: Run affected frontend tests
        if: github.event_name == 'pull_request'
        run: pnpm --dir web test --changed=${{ github.event.pull_request.base.sha }} --passWithNoTests --maxWorkers=2

      - name: Run all frontend tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --dir web test --maxWorkers=2

      - name: Build distribution
        run: ./scripts/build.sh
